<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nafis | go'zallik saloni va sartaroshxona</title>
<meta name="description" content="Nafis go'zallik saloni: soch, manikyur, yuz parvarishi, qosh va kiprik, erkaklar sartaroshxonasi. Onlayn yozilish.">
<meta name="theme-color" content="#3a1d3b">
<meta property="og:type" content="website">
<meta property="og:title" content="Nafis | go'zallik saloni va sartaroshxona">
<meta property="og:description" content="Xizmat va ustani tanlang, qulay vaqtga onlayn yoziling.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233a1d3b'/%3E%3Cpath d='M18 52V30a14 14 0 0 1 28 0v22' fill='none' stroke='%23d4829a' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#3a1d3b; --rose:#d4829a; --rose-d:#b5617b; --blush:#fbeff1; --cream:#fff9f5; --gold:#b8894a; --sage:#6f9484;
  --line:#ecd9dd; --mute:#7a6577; --ink:#2b1a2c;
  --display:'Cormorant Garamond',Georgia,serif; --body:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{font-family:var(--body);color:var(--ink);background:var(--cream);line-height:1.6;font-size:16.5px}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

header{background:var(--cream);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;max-width:1120px;margin:0 auto;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;font-size:2rem;text-decoration:none;color:var(--plum);letter-spacing:.02em}
nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
nav a{text-decoration:none;font-weight:600;font-size:.9rem;color:var(--plum)}
nav a:hover{color:var(--rose-d)}
nav .tel{color:var(--rose-d);font-weight:800}
.langs{display:flex;gap:4px}
.langs button{background:transparent;border:2px solid var(--line);color:var(--plum);border-radius:6px;padding:1px 9px;font-weight:800;font-size:.78rem;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}

.btn{display:inline-block;background:var(--plum);color:#fff;font:800 .98rem var(--body);padding:13px 26px;border-radius:999px;text-decoration:none;border:0;cursor:pointer}
.btn:hover{background:#4d2850}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--plum);border:2px solid var(--plum);margin-left:10px}
.btn.ghost:hover{background:var(--plum);color:#fff}
.btn.light{background:#fff;color:var(--plum);border:2px solid var(--line)}

.hero{background:linear-gradient(180deg,var(--blush),var(--cream));padding:56px 0 40px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.eyebrow{font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem;color:var(--gold);margin-bottom:12px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,6vw,4.6rem);line-height:1.02;color:var(--plum);margin-bottom:18px}
.hero-t p:not(.eyebrow){max-width:46ch;color:#5b4a5a;margin-bottom:26px}
.arch{position:relative;max-width:340px;width:100%;justify-self:center}
.arch svg{width:100%;height:auto;display:block}
.arch-note{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:800;font-size:.82rem;color:var(--plum);white-space:nowrap}

.strip{background:var(--plum);color:#fff}
.strip .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-top:18px;padding-bottom:18px}
.strip b{display:block;color:#f3cfd8}
.strip span{font-size:.9rem;opacity:.85}

section{padding:68px 0}
section.soft{background:var(--blush)}
h2{font-family:var(--display);font-weight:700;font-size:clamp(2rem,4.5vw,2.9rem);color:var(--plum);line-height:1.1;margin-bottom:10px}
.sub{max-width:58ch;color:var(--mute);margin-bottom:26px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{background:#fff;border:2px solid var(--line);color:var(--plum);padding:9px 18px;border-radius:999px;font:700 .92rem var(--body);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.grp{font-family:var(--display);font-size:1.6rem;color:var(--plum);margin:24px 0 12px;display:flex;align-items:center;gap:10px}
.grp svg{width:26px;height:26px;color:var(--rose-d)}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.item.on{border-color:var(--rose);background:#fff6f8}
.item.off{opacity:.5}
.item h3{font-size:1rem;line-height:1.3}
.item .meta{font-size:.85rem;color:var(--mute)}
.pop{display:inline-block;background:var(--gold);color:#fff;font-size:.68rem;font-weight:800;border-radius:4px;padding:0 7px;margin-left:6px;vertical-align:middle;font-style:normal}
.item b{display:block;color:var(--rose-d);white-space:nowrap}
.pick{background:#fff;color:var(--plum);border:2px solid var(--plum);border-radius:999px;padding:6px 14px;font:800 .82rem var(--body);cursor:pointer;white-space:nowrap}
.pick:hover{background:var(--plum);color:#fff}
.item.on .pick{background:var(--rose-d);border-color:var(--rose-d);color:#fff}
.pick:disabled{cursor:not-allowed;opacity:.6}
.right{text-align:right;display:grid;gap:6px;justify-items:end}

.masters{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.master{background:#fff;border-radius:16px;padding:22px 14px;text-align:center;border:1px solid var(--line);display:grid;gap:6px;justify-items:center}
.ava{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:2.2rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--rose),var(--gold))}
.master:nth-child(2n) .ava{background:linear-gradient(135deg,var(--sage),var(--rose))}
.master:nth-child(3n) .ava{background:linear-gradient(135deg,var(--plum),var(--rose))}
.master h3{font-family:var(--display);font-size:1.4rem;color:var(--plum)}
.master p{font-size:.84rem;color:var(--mute);line-height:1.35}
.master .pick{margin-top:6px}
.master.off{opacity:.55}

.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.facts div{border-top:4px solid var(--rose);padding-top:14px}
.facts div:nth-child(2){border-color:var(--gold)}.facts div:nth-child(3){border-color:var(--sage)}
.facts h3{font-family:var(--display);font-size:1.4rem;color:var(--plum);margin-bottom:4px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:var(--blush)}

form{display:grid;gap:12px}
label,.lab{display:grid;gap:5px;font-weight:700;font-size:.88rem;color:var(--plum)}
input,select,textarea{padding:11px 13px;border-radius:10px;border:2px solid var(--line);font:1rem var(--body);background:#fff;color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--rose);outline:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{display:none;padding:12px 14px;border-radius:10px;font-weight:700;font-size:.93rem}
.msg.good{display:block;background:#e3f2ea;color:#1f5a3c}
.msg.bad{display:block;background:#fbe3e8;color:#7d1a35}
.rv-list{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:30px}
.rv{background:#fff;border:1px solid var(--line);border-left:5px solid var(--rose);border-radius:12px;padding:16px 18px}
.rv .st{color:var(--gold);letter-spacing:2px}
.rv small{color:var(--mute)}
.rvform{max-width:520px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.card{background:#fff;border:1px solid var(--line);border-top:5px solid var(--rose);border-radius:12px;padding:20px}
.card:nth-child(2){border-top-color:var(--gold)}.card:nth-child(3){border-top-color:var(--sage)}
.card h3{font-size:.95rem;margin-bottom:4px;color:var(--mute)}
.card a,.card p{font-size:1.1rem;font-weight:800;text-decoration:none}
.card small{display:block;color:var(--mute);margin-top:4px;font-weight:400}
.mapbox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.mapbox iframe{display:block;width:100%;height:320px;border:0}
.mapbar{display:flex;gap:10px;flex-wrap:wrap;padding:12px}
.mapbar .btn{padding:10px 20px;font-size:.9rem}
footer{background:var(--plum);color:#d9c3d6;padding:24px 0;font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.f-adm{opacity:.7;text-decoration:none}.f-adm:hover{opacity:1;text-decoration:underline}

/* yozilish paneli */
.bkbtn{position:fixed;right:16px;bottom:16px;z-index:30;background:var(--rose-d);color:#fff;border:0;border-radius:999px;padding:14px 22px;font:800 1rem var(--body);cursor:pointer;box-shadow:0 8px 24px #3a1d3b55}
.scrim{position:fixed;inset:0;background:#2b1a2c99;z-index:40;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;z-index:50;transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility .25s;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.drawer.open{transform:none;visibility:visible}
.dhead{display:flex;justify-content:space-between;align-items:center}
.dhead h3{font-family:var(--display);font-size:1.7rem;color:var(--plum)}
.dhead button{background:none;border:0;font-size:1.4rem;cursor:pointer;color:var(--plum)}
.bkbox{display:flex;flex-direction:column;gap:12px}
.empty{color:var(--mute)}
#sel-list{list-style:none}
#sel-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
#sel-list small{color:var(--mute);display:block}
#sel-list button{background:none;border:0;color:var(--rose-d);font-weight:800;cursor:pointer;font-size:1.1rem}
.dtotal{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:800}
.dur{color:var(--mute);font-size:.9rem;margin-top:-6px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.day{flex:none;width:60px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 0;text-align:center;cursor:pointer;color:var(--plum);font:700 .8rem var(--body)}
.day b{display:block;font-size:1.15rem}
.day[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.day:disabled{opacity:.35;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 0;font:800 .9rem var(--body);cursor:pointer;color:var(--plum)}
.slot[aria-pressed="true"]{background:var(--rose-d);border-color:var(--rose-d);color:#fff}
.hint{font-size:.85rem;color:var(--mute);font-weight:400}
#status{display:grid;gap:14px;align-content:start}
#status h4{font-family:var(--display);font-size:1.6rem;color:var(--plum)}
.steps{list-style:none;display:grid;gap:8px}
.steps li{display:flex;align-items:center;gap:10px;color:var(--mute);font-weight:600}
.steps li::before{content:"";width:18px;height:18px;border-radius:50%;border:3px solid var(--line);flex:none}
.steps li.done{color:var(--ink)}
.steps li.done::before{background:var(--sage);border-color:var(--sage)}
.steps li.now{color:var(--ink);font-weight:800}
.steps li.now::before{border-color:var(--rose);background:var(--rose)}

/* talon */
.tkwrap{position:fixed;inset:0;z-index:70;background:#2b1a2ccc;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px;overflow-y:auto}
.tk{background:#fff;width:min(400px,100%);border-radius:14px;overflow:hidden;box-shadow:0 12px 44px #0007;margin:auto}
.tk-bar{height:12px;background:linear-gradient(90deg,var(--rose),var(--gold),var(--sage))}
.tk-in{padding:20px 22px 22px}
.tk-head{text-align:center;display:grid;gap:2px;padding-bottom:12px;border-bottom:2px dashed var(--line)}
.tk-head b{font-family:var(--display);font-size:2rem;color:var(--plum)}
.tk-head span{font-size:.86rem;color:var(--mute)}
.tk-meta{display:grid;gap:4px;padding:12px 0;border-bottom:2px dashed var(--line);font-size:.92rem}
.tk-meta div{display:flex;justify-content:space-between;gap:12px}
.tk-meta span:last-child{text-align:right;font-weight:700}
#tk-rows{width:100%;border-collapse:collapse;font-size:.92rem;margin:10px 0}
#tk-rows td{padding:5px 0;vertical-align:top}
#tk-rows td:last-child{text-align:right;white-space:nowrap}
.tk-total{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:800;border-top:2px dashed var(--line);padding-top:10px}
.tk-ok{text-align:center;margin-top:14px;font-weight:700;color:var(--sage)}
.tk-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tk-actions .btn{flex:1 1 auto;text-align:center;padding:11px 12px;font-size:.88rem}

/* kabinet */
.kb{position:fixed;inset:0;z-index:100;background:#f7f1f3;overflow-y:auto;font-size:16px}
.kb section{padding:0}
.kb-top{position:sticky;top:0;z-index:2;background:var(--plum);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 18px;flex-wrap:wrap}
.kb-top>b{color:#f3cfd8;font-size:1.1rem}
.kb-sp{flex:1}
.kb-tabs{display:flex;gap:6px;flex-wrap:wrap}
.kb-tabs button,.kb-b{background:transparent;color:#fff;border:2px solid #ffffff44;border-radius:8px;padding:6px 14px;font:700 .88rem var(--body);cursor:pointer}
.kb-tabs button[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:var(--plum)}
.kb-wrap{max-width:1000px;margin:0 auto;padding:18px 16px 80px}
.kb-box{background:#fff;border:2px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.kb-box h2{font-family:var(--body);font-size:1.05rem;margin-bottom:10px;color:var(--plum)}
.kb-login{max-width:380px;margin:40px auto;display:grid;gap:12px}
.kb label{display:grid;gap:3px;font-size:.8rem;font-weight:700;color:var(--mute)}
.kb input,.kb select{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:8px;width:100%;color:var(--ink);background:#fff}
.kb input[type=checkbox]{width:auto}
.kb-btn{font:800 .92rem var(--body);background:var(--rose);color:var(--plum);border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
.kb-btn.dark{background:var(--plum);color:#fff}.kb-btn.light{background:#fff;border:2px solid var(--line)}
.kb-btn.red{background:#fff;color:#a3243b;border:2px solid #e8c3ca;padding:6px 12px}
.kb-btn:disabled{opacity:.55;cursor:wait}
.kb-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.kb-bar>*{flex:1 1 160px}.kb-bar .kb-btn{flex:0 0 auto}
.kb-hint{font-size:.88rem;color:var(--mute);margin:8px 0}
.kb-msg{display:none;padding:10px 14px;border-radius:8px;font-weight:700;margin-top:10px}
.kb-msg.good{display:block;background:#e3f2ea;color:#1f5a3c}.kb-msg.bad{display:block;background:#fbe3e8;color:#7d1a35}
.kb-warn{background:#fff4de;border:2px solid #f0d49a;color:#6a4a0a;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.kb pre{background:#f7f1f3;border-radius:8px;padding:10px;overflow:auto;font-size:.85rem;margin-top:8px}
.kb-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kb-stat{background:#fff;border:2px solid var(--line);border-top:5px solid var(--sage);border-radius:12px;padding:12px 14px}
.kb-stat span{display:block;font-size:.8rem;color:var(--mute);font-weight:700}
.kb-stat b{font-size:1.2rem}
.kb-stat.hot{border-top-color:#a3243b;background:#fdf0f2}
.kb-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.kb-chips button{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font:700 .84rem var(--body);cursor:pointer;color:var(--plum)}
.kb-chips button[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.kb-chips input[type=date]{width:auto}
.kb-o{background:#fff;border:2px solid var(--line);border-left:6px solid var(--gold);border-radius:12px;margin-bottom:12px}
.kb-o.s-new{border-left-color:#a3243b;box-shadow:0 0 0 2px #a3243b22}
.kb-o.s-done{border-left-color:var(--sage)}.kb-o.s-cancelled{border-left-color:#b9a6b5;opacity:.75}
.kb-oh{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.kb-oh small{margin-left:auto;color:var(--mute)}
.kb-st{background:#f1e6ea;border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:800}
.s-new .kb-st{background:#a3243b;color:#fff}
.kb-ob{padding:10px 14px;display:grid;gap:3px;font-size:.95rem}
.kb-ob ul{list-style:none;margin:6px 0;border-top:1px dashed var(--line);padding-top:6px}
.kb-ob li{display:flex;justify-content:space-between;gap:10px}
.kb-ot{display:flex;justify-content:space-between;font-size:1.05rem}
.kb-oa{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px}
.kb-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kb-col{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px}
.kb-col h3{font-family:var(--display);font-size:1.3rem;color:var(--plum);margin-bottom:6px}
.kb-slot{border-left:4px solid var(--sage);padding:4px 10px;margin-bottom:8px;background:#f7f9f8;border-radius:0 8px 8px 0;font-size:.9rem}
.kb-slot.s-new{border-left-color:#a3243b;background:#fdf0f2}
.kb-slot b{display:block}
.kb-item{border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff}
.kb-item.off{background:#f4eef0}
.kb-g1{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px}
.kb-g2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.kb-chk{display:flex;gap:16px;flex-wrap:wrap}
.kb-chk label{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);font-size:.9rem}

@media(max-width:960px){.masters{grid-template-columns:repeat(3,1fr)}.gal{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){
  .hero .wrap,.facts,.cards,.rv-list,.row2,.svc,.strip .wrap{grid-template-columns:1fr}
  .hero{padding-top:34px}
  .arch{max-width:230px}
  .btn.ghost{margin:10px 0 0}
  header{position:static}
  html{scroll-padding-top:12px}
  nav{gap:8px 14px}nav a{font-size:.85rem}
  .tabs{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px 18px;padding:0 20px 6px;scrollbar-width:none}.tab{flex:none}
  .masters{grid-template-columns:1fr 1fr}
  section{padding:50px 0}
  .kb-stats{grid-template-columns:1fr 1fr}.kb-g1,.kb-g2{grid-template-columns:1fr}
  .slots{grid-template-columns:repeat(3,1fr)}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.drawer{transition:none}}
@media print{
  body>*:not(#tkwrap){display:none!important}
  #tkwrap{position:static!important;background:none!important;display:block!important;padding:0!important}
  .tk{box-shadow:none!important;margin:0 auto}
  .noprint{display:none!important}
  .kb{display:none!important}
}

/* ===== ZAMONAVIY QATLAM ===== */
header{background:rgba(255,249,245,.82);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.btn{transition:transform .18s,box-shadow .18s,background .18s;box-shadow:0 6px 18px -8px rgba(58,29,59,.55)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px -10px rgba(58,29,59,.6)}
.btn.light,.btn.ghost{box-shadow:none}
.hero{position:relative;background:radial-gradient(60% 70% at 85% 10%,#f6d3dd 0,transparent 60%),radial-gradient(50% 60% at 5% 90%,#efe2cf 0,transparent 60%),linear-gradient(180deg,var(--blush),var(--cream))}
.open-badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 11px;font-weight:800;font-size:.8rem;color:var(--plum);margin-bottom:14px;box-shadow:0 4px 14px -8px rgba(58,29,59,.4)}
.open-badge i{width:9px;height:9px;border-radius:50%;background:#9aa;display:block}
.open-badge.on i{background:#2e9e6b;box-shadow:0 0 0 0 #2e9e6b88;animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px #2e9e6b00}100%{box-shadow:0 0 0 0 #2e9e6b00}}
.fchip{position:absolute;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #fff;border-radius:16px;padding:10px 16px;box-shadow:0 14px 30px -14px rgba(58,29,59,.45);display:flex;align-items:baseline;gap:8px;animation:float 6s ease-in-out infinite}
.fchip b{font-family:var(--display);font-size:1.9rem;color:var(--rose-d);line-height:1}
.fchip span{font-weight:700;font-size:.8rem;color:var(--plum)}
.fchip.c1{left:-26px;top:70px}.fchip.c2{right:-22px;top:190px;animation-delay:-3s}
@keyframes float{50%{transform:translateY(-9px)}}
.how{padding:58px 0 10px}
.how-g{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.how-c{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;position:relative;box-shadow:0 18px 36px -26px rgba(58,29,59,.4)}
.how-c em{font:700 2.4rem/1 var(--display);font-style:normal;color:var(--rose);display:block;margin-bottom:6px}
.how-c h3{font-family:var(--display);font-size:1.45rem;color:var(--plum);margin-bottom:4px}
.how-c p{color:var(--mute);font-size:.95rem}
.item,.master,.card,.rv,.facts>div{border-radius:18px;transition:transform .2s,box-shadow .2s,border-color .2s}
.item:hover,.master:hover,.card:hover{transform:translateY(-3px);box-shadow:0 18px 32px -22px rgba(58,29,59,.5)}
.faq{display:grid;gap:10px;max-width:780px}
.faq details{background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 18px;transition:border-color .2s}
.faq details[open]{border-color:var(--rose)}
.faq summary{cursor:pointer;font-weight:800;color:var(--plum);padding:15px 26px 15px 0;list-style:none;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:1.5rem;color:var(--rose-d);transition:transform .2s}
.faq details[open] summary::after{transform:translateY(-50%) rotate(45deg)}
.faq p{color:var(--mute);padding:0 0 16px}
.rvx{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.rvx.in{opacity:1;transform:none}
.totop{position:fixed;left:18px;bottom:22px;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;text-decoration:none;font-weight:800;color:var(--plum);box-shadow:0 10px 24px -12px rgba(58,29,59,.5);z-index:15}
.bkbtn{box-shadow:0 14px 30px -10px rgba(181,97,123,.7)}
@media (max-width:760px){.how-g{grid-template-columns:1fr}.fchip.c1{left:-6px}.fchip.c2{right:-6px}.how{padding-top:40px}}
@media (prefers-reduced-motion:reduce){.fchip,.open-badge i{animation:none}.rvx{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
@media print{.totop,.fchip{display:none!important}}
.faq{margin-top:18px}
@media (max-width:760px){
  .nav{flex-wrap:nowrap;padding:8px 16px}
  nav{gap:10px;flex-wrap:nowrap}
  nav>a:not(.tel){display:none}
  nav .tel{font-size:.82rem;white-space:nowrap}
  .logo{font-size:1.7rem}
}

    await sendSimple('/review', f, ['⭐ <b>' + esc2(C.NOM) + ': yangi fikr</b> ' + '★'.repeat(+f.baho), '', '👤 ' + esc2(f.ism), '💬 ' + esc2(f.matn)].join('\n'));
    msg.textContent = t('rv_ok'); msg.className = 'msg good'; form.reset();
  } catch (err) { msg.textContent = explain(err); msg.className = 'msg bad'; }
  finally { btn.disabled = false; btn.textContent = old; }
});
let REVIEWS = (C.FIKRLAR || []).slice();
function renderReviews() {
  const l = $('rv-list'); l.hidden = !REVIEWS.length;
  l.innerHTML = REVIEWS.map(r => `<div class="rv"><div class="st">${'★'.repeat(Math.max(1, Math.min(5, +r.baho || 5)))}</div><p>${esc(r.matn)}</p><small>${esc(r.ism)}</small></div>`).join('');
}
function renderGallery() {
  const g = C.GALEREYA || []; $('galereya').hidden = !g.length;
  $('gal').innerHTML = g.map(f => `<img src="rasmlar/${esc(f)}" alt="" loading="lazy">`).join('');
}
function renderMap() {
  const M = C.HARITA || {}, q = (M.lat && M.lng) ? `${M.lat},${M.lng}` : (M.qidiruv || C.MANZIL);
  $('map').src = `https://www.google.com/maps?q=${encodeURIComponent(q)}&output=embed&hl=${lang}`;

  $('route-y').href = `https://yandex.com/maps/?text=${encodeURIComponent(q)}`;
}

/* ============ TIL VA UMUMIY ============ */
function applyI18n() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.title = `${C.NOM} | ${t('nav_services')}`;
}
function fillStatic() {
  const tel = telShow(C.TELEFON);
  $('logo').textContent = C.NOM;
  ['navtel', 'c-tel'].forEach(id => { $(id).textContent = tel; $(id).href = 'tel:' + C.TELEFON; });
  $('c-addr').textContent = $('tk-addr').textContent = C.MANZIL; $('tk-tel').textContent = tel; $('tk-name').textContent = C.NOM;
  $('f-left').textContent = `© ${new Date().getFullYear()} ${C.NOM}`; $('f-right').textContent = `${C.MANZIL} · ${tel}`;
  const soc = []; if (C.INSTAGRAM) soc.push('Instagram: @' + C.INSTAGRAM); if (C.TELEGRAM) soc.push('Telegram: @' + C.TELEGRAM);
  $('c-social').textContent = soc.join(' · ');
}
function renderOpen() {
  const n = tashNow(), wd = wdOf(n.date), b = $('open-badge');
  const open = !H.yopiq.includes(wd) && n.min >= H.dan && n.min < H.gacha;
  b.hidden = false; b.classList.toggle('on', open);
  if (open) $('open-txt').textContent = t('open_on').replace('%s', hm(H.gacha));
  else {
    let d = 0, ok = !H.yopiq.includes(wd) && n.min < H.dan;
    if (!ok) { d = 1; while (d < 8 && H.yopiq.includes((wd + d) % 7)) d++; }
    $('open-txt').textContent = d >= 8 ? t('open_off_today') : t('open_off').replace('%s', (d ? (d === 1 ? '' : t('wd')[(wd + d) % 7] + ' ') : '') + hm(H.dan));
  }
}
function renderHours() {
  renderOpen();
  $('hero-n').textContent = SVC.reduce((a, c) => a + c.items.length, 0); $('hero-m').textContent = MAS.filter(m => !m.off).length;
  $('c-hours').textContent = `${hm(H.dan)} – ${hm(H.gacha)}`;
  $('c-closed').textContent = H.yopiq.length ? t('closed') + ' ' + H.yopiq.map(d => t('wd')[d]).join(', ') : '';
}
function renderAll() {
  indexData(); renderTabs(); renderServices(); renderMasters(); renderReviews(); renderMap(); renderHours();
  pend ? renderStatus() : renderBooking();
}
function setLang(l) { lang = l; store.set('nf_lang', l); applyI18n(); renderAll(); }
document.querySelector('.langs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setLang(b.dataset.lang); });

function enhance() {
  const els = document.querySelectorAll('.how-c,.facts>div,.card,.master,.faq details,.rvform,.strip .wrap>div');
  if (!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 });
  els.forEach(el => { el.classList.add('rvx'); io.observe(el); });
  const up = $('totop'); window.addEventListener('scroll', () => { up.hidden = window.scrollY < 700; }, { passive: true });
  const ld = document.createElement('script'); ld.type = 'application/ld+json';
  ld.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'BeautySalon', name: C.NOM, telephone: C.TELEFON, address: C.MANZIL, openingHours: C.ISH.dan + '-' + C.ISH.gacha });
  document.head.appendChild(ld);
}
fillStatic(); renderGallery(); applyI18n(); renderAll(); enhance();
if (pend) startPolling();
if (API) {
  api('/cfg').then(j => {
    if (j && j.services) { SVC = j.services; if (j.masters) MAS = j.masters; if (j.hours) H = { dan: toMin(j.hours.dan), gacha: toMin(j.hours.gacha), yopiq: j.hours.yopiq || [] }; renderAll(); }
  }).catch(() => {});
  api('/reviews').then(j => { if (j && j.reviews) { REVIEWS = (C.FIKRLAR || []).concat(j.reviews); renderReviews(); } }).catch(() => {});
}
window.NAFIS = { get svc() { return SVC; }, get mas() { return MAS; } };
})();

</script>
<script>
/* NAFIS KABINETI (admin panel). Saytni "#admin" bilan oching: index.html#admin */
(function () {
'use strict';
const C = SOZLAMA, API = (C.API_URL || '').replace(/\/+$/, '');
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = n => Math.round(n).toLocaleString('ru-RU') + " so'm";
const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const ST = { new: 'Yangi', accepted: 'Tasdiqlangan', done: 'Bajarilgan', cancelled: 'Bekor qilingan' };
const WD = ['Yakshanba', 'Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba'];
const WDORD = [1, 2, 3, 4, 5, 6, 0];
const tashDay = ts => new Date(ts).toLocaleDateString('en-CA', { timeZone: 'Asia/Tashkent' });
const addDays = (iso, n) => new Date(new Date(iso + 'T00:00:00Z').getTime() + n * 864e5).toISOString().slice(0, 10);
let root, $, pw = '', tab = 'orders', filt = 'all', timer = null, list = [], seen = null, flash = null;
let data = null, cat = 0, sday = '';
const baseTitle = document.title;

function build() {
  root = document.createElement('div');
  root.className = 'kb'; root.hidden = true;
  root.innerHTML = `
  <div class="kb-top">
    <b>${esc(C.NOM)} · Kabinet</b>
    <div class="kb-tabs" id="kb-tabs" hidden>
      <button type="button" data-tab="orders" aria-pressed="true">Yozilishlar</button>
      <button type="button" data-tab="svc" aria-pressed="false">Xizmatlar</button>
      <button type="button" data-tab="team" aria-pressed="false">Ustalar va vaqt</button>
    </div>
    <span class="kb-sp"></span>
    <button type="button" class="kb-b" id="kb-site">Saytga qaytish</button>
    <button type="button" class="kb-b" id="kb-out" hidden>Chiqish</button>
  </div>
  <div class="kb-wrap">
    <form class="kb-box kb-login" id="kb-login" hidden>
      <h2>Kabinetga kirish</h2>
      <label>Admin paroli<input type="password" id="kb-pw" autocomplete="current-password" required></label>
      <button class="kb-btn" type="submit">Kirish</button>
      <div class="kb-msg" id="kb-lmsg"></div>
    </form>
    <div class="kb-warn" id="kb-warn" hidden>Narx va ustalar serverga hali saqlanmagan, shuning uchun yozilish qabul qilinmaydi. "Xizmatlar" bo'limiga kirib, pastdagi <b>Serverga saqlash</b> tugmasini bir marta bosing.</div>

    <section id="kb-orders" hidden>
      <div class="kb-stats" id="kb-stats"></div>
      <div class="kb-chips" id="kb-chips"></div>
      <div id="kb-olist"></div>
      <p class="kb-hint" id="kb-live">Ro'yxat har 10 soniyada yangilanadi. Yangi yozilish kelsa, ovoz chiqadi.</p>
    </section>

    <section id="kb-svc" hidden>
      <div class="kb-box">
        <h2>Xizmatlar va narxlar</h2>
        <div class="kb-bar">
          <label>Bo'lim<select id="kb-cat"></select></label>
          <label>Qidirish<input type="search" id="kb-find" placeholder="Xizmat nomi"></label>
          <button class="kb-btn dark" id="kb-add" type="button">+ Yangi xizmat</button>
        </div>
      </div>
      <div id="kb-list"></div>
    </section>

    <section id="kb-team" hidden>
      <div class="kb-box">
        <h2>Ish vaqti</h2>
        <div class="kb-bar">
          <label>Ochilish<input type="time" id="kb-dan"></label>
          <label>Yopilish<input type="time" id="kb-gacha"></label>
          <label>Vaqt oralig'i (daqiqa)<input type="number" id="kb-qadam" min="10" max="120" step="5"></label>
        </div>
        <div class="kb-chk" id="kb-days" style="margin-top:10px"></div>
        <p class="kb-hint">Belgilangan kunlar dam olish kuni hisoblanadi, ularga yozilib bo'lmaydi.</p>
      </div>
      <div class="kb-box">
        <h2>Ustalar</h2>
        <div id="kb-masters"></div>
        <button class="kb-btn dark" id="kb-madd" type="button">+ Yangi usta</button>
      </div>
    </section>

    <div class="kb-box" id="kb-savebox" hidden>
      <h2>Saqlash</h2>
      <div class="kb-bar">
        <button class="kb-btn" id="kb-save" type="button" hidden>Serverga saqlash</button>
        <button class="kb-btn light" id="kb-dl" type="button">xizmatlar.js ni yuklab olish</button>
      </div>
      <div class="kb-msg" id="kb-msg" role="status"></div>
      <div id="kb-local" hidden><p class="kb-hint">Server ulanmagan: yuklab olingan <b>xizmatlar.js</b> ni sayt papkasidagi eski fayl o'rniga qo'ying. Ish vaqti va dam olish kunlarini <b>sozlamalar.js</b> dagi <b>ISH</b> qatorida o'zgartirasiz. Hozirgi qiymat:</p><pre id="kb-snip"></pre></div>
    </div>
  </div>`;
  document.body.appendChild(root);
  $ = id => root.querySelector('#' + id);
  $('kb-site').onclick = () => { location.hash = ''; };
  $('kb-out').onclick = logout;
  $('kb-login').addEventListener('submit', e => { e.preventDefault(); login($('kb-pw').value); });
  $('kb-tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); });
  $('kb-chips').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { filt = b.dataset.f; drawOrders(); } });
  $('kb-chips').addEventListener('change', e => { if (e.target.type === 'date') { sday = e.target.value; filt = 'day'; drawOrders(); } });
  $('kb-olist').addEventListener('click', onAction);
  wireEdit();
}

/* ============ KIRISH ============ */
async function call(path, body) {
  const opt = { headers: { 'x-admin': pw } };
  if (body !== undefined) { opt.method = 'POST'; opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const res = await fetch(API + path, opt);
  const j = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(j.error || ('HTTP ' + res.status)); e.status = res.status; throw e; }
  return j;
}
function show(loggedIn) {
  $('kb-login').hidden = loggedIn; $('kb-tabs').hidden = !loggedIn; $('kb-out').hidden = !(loggedIn && API);
  if (!loggedIn) { ['kb-orders', 'kb-svc', 'kb-team', 'kb-savebox', 'kb-warn'].forEach(i => { $(i).hidden = true; }); }
  else setTab(tab);
}
async function login(p) {
  const msg = $('kb-lmsg'); msg.className = 'kb-msg';
  pw = p;
  try {
    const j = await call('/admin/bookings');
    try { sessionStorage.setItem('nf_admin', pw); } catch (_) {}
    gotList(j.bookings, true); show(true); startPolling();
    await loadFromServer();
  } catch (e) {
    pw = '';
    if (e.status === 401) { msg.textContent = "Parol noto'g'ri."; msg.className = 'kb-msg bad'; }
    else if (!$('kb-login').hidden || p) { msg.textContent = "Serverga ulanib bo'lmadi: " + e.message; msg.className = 'kb-msg bad'; show(false); }
  }
}
function logout() {
  pw = ''; stopPolling(); try { sessionStorage.removeItem('nf_admin'); } catch (_) {}
  $('kb-pw').value = ''; show(false);
}
function setTab(t) {
  tab = t;
  root.querySelectorAll('#kb-tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === t)));
  $('kb-orders').hidden = t !== 'orders'; $('kb-svc').hidden = t !== 'svc'; $('kb-team').hidden = t !== 'team';
  $('kb-savebox').hidden = t === 'orders';
  if (t === 'orders') drawOrders();
}

/* ============ YOZILISHLAR ============ */
function startPolling() { stopPolling(); timer = setInterval(refresh, 10000); }
function stopPolling() { if (timer) { clearInterval(timer); timer = null; } }
async function refresh() { try { const j = await call('/admin/bookings'); gotList(j.bookings, false); } catch (e) { if (e.status === 401) logout(); } }
function beep() {
  try {
    const A = window.AudioContext || window.webkitAudioContext, ctx = new A(), o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); o.stop(ctx.currentTime + 0.25); setTimeout(() => ctx.close(), 600);
  } catch (_) {}
}
function gotList(l, firstLoad) {
  list = l || [];
  const fresh = list.filter(o => o.status === 'new' && seen && !seen.has(o.id));
  if (!seen) seen = new Set();
  list.forEach(o => seen.add(o.id));
  if (fresh.length && !firstLoad) {
    beep();
    if (!flash) { let on = false; flash = setInterval(() => { document.title = (on = !on) ? `(${fresh.length}) Yangi yozilish!` : baseTitle; }, 900); }
  }
  if (!root.hidden && tab === 'orders') drawOrders();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && flash) { clearInterval(flash); flash = null; document.title = baseTitle; } });

function drawOrders() {
  if (!API) {
    $('kb-stats').innerHTML = ''; $('kb-chips').innerHTML = '';
    $('kb-olist').innerHTML = `<div class="kb-box"><h2>Yozilishlar ro'yxati</h2><p>Ro'yxat, kunlik jadval va statistika server (worker) ulangandan keyin ishlaydi. Hozir yozilishlar faqat Telegram botga keladi.</p><p class="kb-hint">Ulash: <b>ULASH.md</b> faylining 4-bo'limi.</p></div>`;
    $('kb-live').hidden = true; return;
  }
  const today = tashDay(Date.now()), tomorrow = addDays(today, 1);
  if (!sday) sday = today;
  const live = list.filter(x => x.status !== 'cancelled');
  const td = live.filter(x => x.order.date === today);
  const rev = td.filter(x => x.status !== 'new').reduce((s, x) => s + x.order.total, 0);
  $('kb-stats').innerHTML = [['Bugungi yozilishlar', td.length], ['Bugungi tushum (tasdiqlangan)', fmt(rev)], ['Javob kutayotgan', list.filter(x => x.status === 'new').length], ['Ertaga', live.filter(x => x.order.date === tomorrow).length]]
    .map(([a, b], i) => `<div class="kb-stat${i === 2 && b ? ' hot' : ''}"><span>${a}</span><b>${b}</b></div>`).join('');
  const F = [['all', 'Hammasi'], ['new', 'Yangi'], ['accepted', 'Tasdiqlangan'], ['done', 'Bajarilgan'], ['cancelled', 'Bekor qilingan'], ['day', 'Kunlik jadval']];
  $('kb-chips').innerHTML = F.map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${k === filt}">${l}</button>`).join('') + `<input type="date" value="${esc(sday)}">`;
  if (filt === 'day') { $('kb-olist').innerHTML = scheduleHTML(); return; }
  const rows = list.filter(x => filt === 'all' || x.status === filt);
  $('kb-olist').innerHTML = rows.length ? rows.map(card).join('') : '<p class="kb-hint">Bu bo\'limda yozilish yo\'q.</p>';
}
function scheduleHTML() {
  const rows = list.filter(x => x.order.date === sday && x.status !== 'cancelled').sort((a, b) => a.order.start - b.order.start);
  const ms = (data ? data.masters : (typeof MASTERS !== 'undefined' ? MASTERS : [])).map(m => ({ id: m.id, n: m.n }));
  rows.forEach(x => { if (x.order.m && !ms.some(m => m.id === x.order.m)) ms.push({ id: x.order.m, n: x.order.mn || x.order.m }); });
  const cols = ms.map(m => {
    const mine = rows.filter(x => x.order.m === m.id);
    return `<div class="kb-col"><h3>${esc(m.n)}</h3>${mine.map(x => `<div class="kb-slot s-${x.status}"><b>${hm(x.order.start)}–${hm(x.order.start + x.order.dur)}</b>${esc(x.order.ism)} · ${esc(x.order.items.map(i => i.n).join(', '))}</div>`).join('') || '<p class="kb-hint">Bo\'sh</p>'}</div>`;
  }).join('');
  return rows.length ? `<div class="kb-cols">${cols}</div>` : '<p class="kb-hint">Bu kunga yozilish yo\'q.</p>';
}
function buttons(x) {
  const b = (a, t, cls) => `<button type="button" class="kb-btn ${cls || ''}" data-act="${a}" data-id="${esc(x.id)}">${t}</button>`;
  if (x.status === 'new') return b('ok', '✅ Tasdiqlash') + b('no', '❌ Bekor qilish', 'light');
  if (x.status === 'accepted') return b('done', '🏁 Bajarildi') + b('no', '❌ Bekor qilish', 'light');
  return '';
}
function card(x) {
  const o = x.order;
  return `<article class="kb-o s-${x.status}">
    <div class="kb-oh"><b>${esc(x.id)}</b><span class="kb-st">${ST[x.status]}</span><small>${esc(o.time)}</small></div>
    <div class="kb-ob">
      <div><b>${esc(o.ism)}</b> · <a href="tel:${esc(o.tel)}">${esc(o.tel)}</a></div>
      <div>🗓 ${esc(o.date)} · ${hm(o.start)}–${hm(o.start + o.dur)} · Usta: ${esc(o.mn || '-')}${o.izoh ? ' · 💬 ' + esc(o.izoh) : ''}</div>
      <ul>${o.items.map(i => `<li>${esc(i.n)} <span>${fmt(i.p)}</span></li>`).join('')}</ul>
      <div class="kb-ot">Jami <b>${fmt(o.total)}</b></div>
    </div>
    <div class="kb-oa">${buttons(x)}</div></article>`;
}
async function onAction(e) {
  const b = e.target.closest('[data-act]'); if (!b) return;
  b.disabled = true;
  try { await call('/admin/status', { id: b.dataset.id, act: b.dataset.act }); await refresh(); }
  catch (err) { alert(err.message); await refresh(); }
}

/* ============ XIZMAT / USTA / VAQT TAHRIRI ============ */
const say = (t, ok) => { const m = $('kb-msg'); m.textContent = t; m.className = 'kb-msg ' + (ok ? 'good' : 'bad'); };
function initData() {
  const ish = C.ISH || {};
  data = { services: JSON.parse(JSON.stringify(SERVICES)), masters: JSON.parse(JSON.stringify(MASTERS)),
    hours: { dan: ish.dan || '09:00', gacha: ish.gacha || '20:00', yopiq: (ish.yopiq || []).slice(), qadam: ish.qadam || 30, minimal: ish.minimal == null ? 30 : ish.minimal, oldindan: ish.oldindan || 14 } };
  cat = 0; drawEdit();
}
async function loadFromServer() {
  try {
    const j = await (await fetch(API + '/cfg')).json();
    if (j && j.services) { data = { services: j.services, masters: j.masters || [], hours: Object.assign({ qadam: 30, minimal: 30, oldindan: 14 }, j.hours) }; cat = 0; drawEdit(); $('kb-warn').hidden = true; }
    else $('kb-warn').hidden = false;
  } catch (_) {}
}
function drawEdit() {
  $('kb-cat').innerHTML = data.services.map((c, i) => `<option value="${i}"${i === cat ? ' selected' : ''}>${esc(c.n.uz)} (${c.items.length})</option>`).join('');
  drawList(); drawTeam();
}
function drawList() {
  const q = $('kb-find').value.trim().toLowerCase(), c = data.services[cat];
  $('kb-list').innerHTML = (c ? c.items : []).map((it, i) => ({ it, i })).filter(({ it }) => !q || it.n.uz.toLowerCase().includes(q)).map(({ it, i }) => `
    <div class="kb-item${it.off ? ' off' : ''}" data-i="${i}">
      <div class="kb-g1">
        <label>Nomi (UZ)<input data-k="n.uz" value="${esc(it.n.uz)}"></label>
        <label>Narx (so'm)<input data-k="p" type="number" min="0" step="1000" value="${it.p}"></label>
        <label>Davomiyligi (daqiqa)<input data-k="min" type="number" min="5" max="600" step="5" value="${it.min}"></label>
        <button class="kb-btn red" data-del="1" type="button">O'chirish</button>
      </div>
      <div class="kb-g2">
        <label>Nomi (RU)<input data-k="n.ru" value="${esc(it.n.ru || '')}"></label>
        <label>Nomi (EN)<input data-k="n.en" value="${esc(it.n.en || '')}"></label>
        <label>Kod<input value="${esc(it.id)}" disabled></label>
      </div>
      <div class="kb-chk">
        <label><input type="checkbox" data-k="pop"${it.pop ? ' checked' : ''}> Mashhur</label>
        <label><input type="checkbox" data-k="off"${it.off ? ' checked' : ''}> Hozir yo'q</label>
      </div></div>`).join('') || '<p class="kb-hint">Xizmat topilmadi.</p>';
}
function drawTeam() {
  const h = data.hours;
  $('kb-dan').value = h.dan; $('kb-gacha').value = h.gacha; $('kb-qadam').value = h.qadam || 30;
  $('kb-days').innerHTML = WDORD.map(d => `<label><input type="checkbox" data-d="${d}"${h.yopiq.includes(d) ? ' checked' : ''}> ${WD[d]}</label>`).join('');
  $('kb-masters').innerHTML = data.masters.map((m, i) => `
    <div class="kb-item${m.off ? ' off' : ''}" data-mi="${i}">
      <div class="kb-g1">
        <label>Ismi<input data-mk="n" value="${esc(m.n)}"></label>
        <label>Yo'nalishi (UZ)<input data-mk="r.uz" value="${esc((m.r && m.r.uz) || '')}"></label>
        <label>Yo'nalishi (RU)<input data-mk="r.ru" value="${esc((m.r && m.r.ru) || '')}"></label>
        <button class="kb-btn red" data-mdel="1" type="button">O'chirish</button>
      </div>
      <div class="kb-chk">
        <label><input type="checkbox" data-mk="r.en-dummy" hidden></label>
        ${data.services.map(c => `<label><input type="checkbox" data-mc="${esc(c.id)}"${(m.cats || []).includes(c.id) ? ' checked' : ''}> ${esc(c.n.uz)}</label>`).join('')}
        <label><input type="checkbox" data-mk="off"${m.off ? ' checked' : ''}> Dam olmoqda</label>
      </div></div>`).join('');
  $('kb-snip').textContent = `ISH: { dan: "${h.dan}", gacha: "${h.gacha}", yopiq: [${h.yopiq.join(', ')}], qadam: ${h.qadam || 30}, oldindan: ${h.oldindan || 14}, minimal: ${h.minimal == null ? 30 : h.minimal} },`;
}
function setPath(o, path, v) { const p = path.split('.'); const last = p.pop(); let t = o; p.forEach(k => { t = t[k] = t[k] || {}; }); t[last] = v; }
function check() {
  for (const c of data.services) for (const i of c.items) {
    i.n.uz = i.n.uz.trim();
    if (!i.n.uz) return "Nomi bo'sh xizmat bor. Nomini yozing yoki o'chiring.";
    if (!i.n.ru) i.n.ru = i.n.uz; if (!i.n.en) i.n.en = i.n.uz;
  }
  for (const m of data.masters) { m.n = m.n.trim(); if (!m.n) return "Ismi bo'sh usta bor."; m.r = m.r || {}; m.r.uz = m.r.uz || ''; m.r.ru = m.r.ru || m.r.uz; m.r.en = m.r.en || m.r.uz; }
  const h = data.hours;
  if (!h.dan || !h.gacha || h.dan >= h.gacha) return "Ish vaqti noto'g'ri: ochilish yopilishdan oldin bo'lsin.";
  return '';
}
function servicesJS() {
  const cs = data.services.map(c => ` {"id":${JSON.stringify(c.id)},"n":${JSON.stringify(c.n)},"items":[\n` + c.items.map(i => '  ' + JSON.stringify(i)).join(',\n') + '\n ]}');
  return "/* NAFIS XIZMATLARI. Kabinet orqali tahrirlab, yuklab olingan faylni shu yerga qo'ying. */\nconst SERVICES = [\n" + cs.join(',\n') + '\n];\nconst MASTERS = ' + JSON.stringify(data.masters, null, 1) + ';\n';
}
function wireEdit() {
  $('kb-list').addEventListener('input', e => {
    const card = e.target.closest('.kb-item'); if (!card) return;
    const it = data.services[cat].items[+card.dataset.i], k = e.target.dataset.k; if (!k) return;
    if (k === 'p') it.p = Math.max(0, Math.round(+e.target.value) || 0);
    else if (k === 'min') it.min = Math.max(5, Math.round(+e.target.value) || 5);
    else if (k === 'pop' || k === 'off') { e.target.checked ? it[k] = 1 : delete it[k]; if (k === 'off') card.classList.toggle('off', e.target.checked); }
    else setPath(it, k, e.target.value);
  });
  $('kb-list').addEventListener('click', e => {
    if (!e.target.dataset.del) return;
    const i = +e.target.closest('.kb-item').dataset.i, it = data.services[cat].items[i];
    if (!confirm(`"${it.n.uz}" o'chirilsinmi?`)) return;
    data.services[cat].items.splice(i, 1); drawEdit();
  });
  $('kb-add').onclick = () => {
    const ids = new Set(data.services.flatMap(c => c.items.map(i => i.id))); let n = 1; while (ids.has('x' + n)) n++;
    data.services[cat].items.unshift({ id: 'x' + n, n: { uz: 'Yangi xizmat', ru: 'Новая услуга', en: 'New service' }, min: 30, p: 50000 });
    $('kb-find').value = ''; drawEdit();
    const f = root.querySelector('#kb-list .kb-item input'); if (f) { f.focus(); f.select(); }
  };
  $('kb-cat').onchange = e => { cat = +e.target.value; drawList(); };
  $('kb-find').oninput = drawList;
  $('kb-dan').onchange = e => { data.hours.dan = e.target.value; drawTeam(); };
  $('kb-gacha').onchange = e => { data.hours.gacha = e.target.value; drawTeam(); };
  $('kb-qadam').onchange = e => { data.hours.qadam = Math.max(10, Math.min(120, Math.round(+e.target.value) || 30)); drawTeam(); };
  $('kb-days').addEventListener('change', e => {
    const d = +e.target.dataset.d, s = new Set(data.hours.yopiq); e.target.checked ? s.add(d) : s.delete(d);
    data.hours.yopiq = [...s].sort(); drawTeam();
  });
  $('kb-masters').addEventListener('input', e => {
    const card = e.target.closest('.kb-item'); if (!card) return;
    const m = data.masters[+card.dataset.mi], k = e.target.dataset.mk, c = e.target.dataset.mc;
    if (c) { const s = new Set(m.cats || []); e.target.checked ? s.add(c) : s.delete(c); m.cats = [...s]; return; }
    if (!k || k.endsWith('dummy')) return;
    if (k === 'off') { e.target.checked ? m.off = 1 : delete m.off; card.classList.toggle('off', e.target.checked); }
    else setPath(m, k, e.target.value);
  });
  $('kb-masters').addEventListener('click', e => {
    if (!e.target.dataset.mdel) return;
    const i = +e.target.closest('.kb-item').dataset.mi;
    if (!confirm(`"${data.masters[i].n}" o'chirilsinmi?`)) return;
    data.masters.splice(i, 1); drawTeam();
  });
  $('kb-madd').onclick = () => {
    const ids = new Set(data.masters.map(m => m.id)); let n = 1; while (ids.has('m' + n)) n++;
    data.masters.push({ id: 'm' + n, n: 'Yangi usta', r: { uz: '', ru: '', en: '' }, cats: [] }); drawTeam();
  };
  $('kb-dl').onclick = () => {
    const err = check(); if (err) return say(err, false);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([servicesJS()], { type: 'text/javascript' }));
    a.download = 'xizmatlar.js'; document.body.appendChild(a); a.click(); a.remove();
    say('xizmatlar.js yuklab olindi.', true);
  };
  $('kb-save').onclick = async () => {
    const err = check(); if (err) return say(err, false);
    $('kb-save').disabled = true;
    try { await call('/cfg', data); say("Saqlandi! Sayt yangi narx, usta va ish vaqtini hozirdanoq ishlatadi.", true); $('kb-warn').hidden = true; }
    catch (e) { say("Saqlab bo'lmadi: " + e.message, false); }
    finally { $('kb-save').disabled = false; }
  };
}

/* ============ OCHISH / YOPISH ============ */
function open() {
  if (!root) { build(); initData(); }
  root.hidden = false; document.body.style.overflow = 'hidden';
  $('kb-save').hidden = !API; $('kb-local').hidden = !!API;
  if (!API) { show(true); return; }
  let saved = ''; try { saved = sessionStorage.getItem('nf_admin') || ''; } catch (_) {}
  if (pw) { show(true); startPolling(); refresh(); return; }
  show(false);
  if (saved) login(saved); else $('kb-pw').focus();
}
function close() { if (!root) return; root.hidden = true; document.body.style.overflow = ''; stopPolling(); }
function sync() { if (location.hash === '#admin') open(); else close(); }
window.addEventListener('hashchange', sync);
sync();
})();

</script>
</body>
